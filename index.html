<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirag Gandhi | Master Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        accentGold: '#d4af37'
                    }
                }
            }
        }
    </script>
    <style>
        /* Glassmorphism & Spring-Physics Bouncy Hover Effect */
        .glassmorphic-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        background 0.3s ease, 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        .glassmorphic-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* Complimentary Diagnostic Highlight Pill */
        .diagnostic-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        body {
            background-color: #090a0f;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accentGold selection:text-black">

    <!-- Header Section -->
    <header class="w-full py-12 px-6 text-center border-b border-white/5 bg-white/[0.01] backdrop-blur-md">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-2">CHIRAG GANDHI</h1>
        <p class="text-sm md:text-base text-gray-400 italic tracking-wider">"Securing You, Securing Your Future."</p>
    </header>

    <!-- Dynamic Framework Grid -->
    <main class="max-w-7xl mx-auto px-6 py-12 w-full">
        <!-- 8 Core Pillars Grid -->
        <div id="framework-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- JavaScript dynamically injects all 8 pillars here -->
        </div>

        <!-- Complimentary Diagnostics / Value-Added Services Section -->
        <div id="diagnostics-container" class="grid grid-cols-1 gap-6">
            <!-- JavaScript dynamically injects complimentary diagnostic features here -->
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="w-full py-8 px-6 text-center border-t border-white/5 bg-white/[0.01] text-sm text-gray-400">
        <p class="mb-1">
            <span class="text-gray-500">† Subject to regulatory vetting and professional mandate.</span>
        </p>
        <p class="font-medium text-gray-300">
            <strong>Chirag Gandhi</strong> | 
            <a href="tel:+919712999007" class="hover:text-white transition-colors">+91 97 12 999 007</a> | 
            <a href="mailto:cggandhi@gmail.com" class="hover:text-white transition-colors">cggandhi@gmail.com</a>
        </p>
    </footer>

    <!-- SSOT Data Engine & Dynamic DOM Injector -->
    <script>
        const MASTER_FRAMEWORK = {
            advisor: {
                name: "Chirag Gandhi",
                tagline: "Securing You, Securing Your Future.",
                phone: "+91 97 12 999 007",
                email: "cggandhi@gmail.com"
            },
            pillars: [
                {
                    id: 1,
                    name: "KAVACH",
                    icon: "🛡️",
                    subtitle: "The Sovereign Shield",
                    domain: "Insurance",
                    scope: "Comprehensive risk management & asset protection (Life · Health · Motor · Business · Digital & Payment Fraud)"
                },
                {
                    id: 2,
                    name: "SAMRUDDHI",
                    icon: "📈",
                    subtitle: "The Enduring Wealth",
                    domain: "Investment & Credit",
                    scope: "Strategic wealth creation, future planning & capital solutions (Mutual Funds · Loans · Credit Cards)"
                },
                {
                    id: 3,
                    name: "SAHAY",
                    icon: "🤝",
                    subtitle: "The Guiding Hand",
                    domain: "Claims Assistance",
                    scope: "Dedicated professional handholding and end-to-end guidance through claim filing and settlement"
                },
                {
                    id: 4,
                    name: "NYAYA",
                    icon: "⚖️",
                    subtitle: "The Righteous Stand",
                    domain: "Legal & Grievances",
                    scope: "Redressal support for claim rejections, short settlements, policy mis-selling, and Ombudsman appeals",
                    isVetted: true
                },
                {
                    id: 5,
                    name: "SWATVA",
                    icon: "🏛️",
                    subtitle: "The Core Identity",
                    domain: "Identity & Documentation",
                    scope: "Credentialing, sovereign records, and legal identification verification"
                },
                {
                    id: 6,
                    name: "LEKHA",
                    icon: "📑",
                    subtitle: "The Pecuniary Registry",
                    domain: "Fiscal Accounts & Compliance",
                    scope: "Income tax returns, financial accounts, and fiscal compliance management"
                },
                {
                    id: 7,
                    name: "NIDHI",
                    icon: "💰",
                    subtitle: "The Monetary Hub",
                    domain: "Credit Solutions",
                    scope: "Credit access, loan facilitation, liquidity optimization, and card provisioning"
                },
                {
                    id: 8,
                    name: "SAUJANYA",
                    icon: "🫴",
                    subtitle: "The Open Threshold",
                    domain: "Advisory Courtesies",
                    scope: "Initial consultations, complimentary credit score assessments, portfolio reviews, and policy evaluations"
                }
            ],
            diagnostics: [
                {
                    icon: "📊",
                    title: "FREE CREDIT SCORE CHECK",
                    badge: "Complimentary Client Diagnostic",
                    description: "Complimentary CIBIL & Credit Health Audit available to all clients to evaluate borrowing readiness, creditworthiness, and financial health."
                }
            ]
        };

        document.addEventListener("DOMContentLoaded", () => {
            // Render 8 Pillars
            const container = document.getElementById("framework-container");
            MASTER_FRAMEWORK.pillars.forEach(pillar => {
                const card = document.createElement("div");
                card.className = "glassmorphic-card p-6 rounded-2xl flex flex-col justify-between";
                
                const daggerMark = pillar.isVetted ? " †" : "";
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="text-3xl">${pillar.icon}</span>
                            <h3 class="text-xl font-bold tracking-wide">
                                ${pillar.id}. ${pillar.name}${daggerMark} — <span class="font-normal text-gray-400 text-sm md:text-base">${pillar.subtitle}</span>
                            </h3>
                        </div>
                        <div class="mb-3">
                            <span class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider rounded-full bg-white/5 text-gray-300 border border-white/10">
                                Domain: ${pillar.domain}
                            </span>
                        </div>
                        <p class="text-sm text-gray-300 leading-relaxed">
                            <strong class="text-white font-medium">Scope & Focus Area:</strong> ${pillar.scope}
                        </p>
                    </div>
                `;
                container.appendChild(card);
            });

            // Render Complimentary Diagnostics Section
            const diagContainer = document.getElementById("diagnostics-container");
            MASTER_FRAMEWORK.diagnostics.forEach(diag => {
                const diagCard = document.createElement("div");
                diagCard.className = "glassmorphic-card diagnostic-card p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4";
                diagCard.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-3xl p-3 bg-accentGold/10 rounded-xl border border-accentGold/20">${diag.icon}</span>
                        <div>
                            <div class="flex items-center space-x-3 mb-1">
                                <h3 class="text-lg font-bold tracking-wide text-white">${diag.title}</h3>
                                <span class="px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wider rounded-md bg-accentGold/20 text-accentGold border border-accentGold/30">
                                    ${diag.badge}
                                </span>
                            </div>
                            <p class="text-sm text-gray-300">${diag.description}</p>
                        </div>
                    </div>
                `;
                diagContainer.appendChild(diagCard);
            });
        });
    </script>
</body>
</html>
